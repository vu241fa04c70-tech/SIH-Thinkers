version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://greenfleet:greenfleet123@db:5432/greenfleet_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-greenfleet-key-2026
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  db:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_USER: greenfleet
      POSTGRES_PASSWORD: greenfleet123
      POSTGRES_DB: greenfleet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
